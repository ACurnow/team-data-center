name: image

# Builds the deploy image and checks that the app starts and answers, without the generated data.
on:
  push:
    paths: [Dockerfile, .dockerignore, deploy/**, pyproject.toml, uv.lock, src/**, app/**, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, deploy/**, pyproject.toml, uv.lock, src/**, app/**, .github/workflows/image.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: TUNNEL_TOKEN=x docker compose -f deploy/compose.yaml --env-file deploy/.env.example config --quiet
      - run: docker build --build-arg GIT_COMMIT=${GITHUB_SHA::7} -t team-data-center:ci .
      - name: The app starts, is healthy, and serves every page's script
        run: |
          docker run -d --name app -p 8501:8501 team-data-center:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy
          curl -fsS http://127.0.0.1:8501/ | grep -q '<div id="root">'
          docker exec app python -c "import dcopt, highspy, geopandas, streamlit; print('imports ok')"
          docker exec app bash -n deploy/build-data.sh
      - if: always()
        run: docker logs app 2>&1 | tail -50
